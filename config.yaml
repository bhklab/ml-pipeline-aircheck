
run_name: "ProteinX"

experiment_name: "LGBMtest" # Experiment Name

#==========================================================================
protein_name: "X" # Protein Name
Train: 'Y' # Running trian phase (N:for no, Y: for yes)
Test: 'Y' # Running test phase (N:for no, Y: for yes)
Screen: 'N'  # Running test phase (N:for no, Y: for yes)
#==========================================================================


# Data:
train_data: [D:\train.parquet]
test_data: [ D:\test.parquet]


# desired_columns:  [ECFP4, ECFP6, FCFP4, FCFP6, TOPTOR, MACCS, RDK, AVALON, ATOMPAIR]           
desired_columns: [ECFP4]

label_column_train: [LABEL]
label_column_test: [LABEL]

nrows_train: 'None' # integer or 'None' 
nrows_test: 'None'

# Note: selecting feature fusion makes the code so slow. Avoid it for big datasets!!
feature_fusion_method: 'None' # options: None, All, Pairwise

# create_balanced_datasets
balance_flag: False # Creating blanced train sets (True/False)
balance_ratios: [1, 2, 4, 8] # balance_ratios: [1, 2, 4, 8]
#==========================================================================


# Screening:
#==========================================================================
screen_data: [D:\screen.parquet]
smiles_column: "SMILES"
chemistry_filters: 'y' #  (N:for no, Y: for yes)
#==========================================================================



# Model
#==========================================================================
# Supported models:
# rf: Random Forest
# lr: Logistic Regression
# svc: Support Vector Classifier
# nb: Gaussian Naive Bayes
# dt: Decision Tree
# knn: K-Nearest Neighbors
# gb: Gradient Boosting
# ada: AdaBoost
# bag: Bagging Classifier
# mlp: Multi-layer Perceptron
# lgbm:
# catboost:
# tf_ff: tensorflow simple feed forward neural network
# desired_models: [rf, lr, sgd, svc, nb, dt, knn, gb, ada, bag, mlp, lgbm, catboost, tf_ff, tf_cnn1D]

desired_models: [lgbm]
#desired_models: [lgbmregressor]

# Models' Hyperparameters tuning
hyperparameters_tuning: 'N' #  (N:for no, Y: for yes)

# Specifying hyperparameters
# hyperparameters: {rf: {n_estimators: 150, max_depth: 10}, tf_ff: {input_shape: 2048, hidden_units: [128, 64], learning_rate: 0.0005}, tf_cnn1D: {input_shape: 2048, conv_layers: [[64, 3], [32, 3]], ff_layers: [64, 32], learning_rate: 0.001}}
# hyperparameters: {tf_ff: {input_shape: 2048, hidden_units: [128, 64], learning_rate: 0.0005}}
hyperparameters: {lgbm: {scale_pos_weight: 10, n_estimators: 3000, learning_rate: 0.02, num_leaves: 31, min_child_samples: 100, subsample: 0.7, subsample_freq: 1, colsample_bytree: 0.6, reg_alpha: 0.5, reg_lambda: 5.0}}

# Cross validation
Nfold: 15 # Number of folds for the Crossfold validatrion method
#==========================================================================


# Conformal Prediction
#==========================================================================
conformal_prediction: 'N' # Running conformal prediction (N:for no, Y: for yes)
confromal_test_size: 0.3
confromal_confidence_level: 0.95
#==========================================================================



# Model selection
#==========================================================================
trainfile_for_modelselection: [] # If empty, the top model by evaluation columns and result on the evaluation set is selected. Example: trainfile_for_modelselection: WDR91_SGC.parquet
evaluationfile_for_modelselection: [] # If empty, the top model by evaluation columns is selected. Exmple: evaluationfile_for_modelselection: evaluation.parquet
evaluation_column: [Test_HitsAt200, Test_HitsAt500,Test_HitsAt100, Test_HitsAt50, Test_PrecisionAt200, Test_PrecisionAt500, Test_TotalHits, Test_F1 Score, Test_Precision, Test_Recall, Test_Accuracy, Test_PlatePPV]
crossvalidation_column: [CV_HitsAt200, CV_HitsAt500, CV_HitsAt100, CV_HitsAt50, CV_PrecisionAt200, CV_PrecisionAt500, CV_TotalHits, CV_F1Score, CV_Precision, CV_Recall, CV_Accuracy, CV_PlatePPV]
#==========================================================================



# Model Fusion
#==========================================================================
Fusion: 'N' # Running model fusion (N:for no, Y: for yes)
num_top_models: 5
#==========================================================================





