screen_data: [D:\screen.parquet]   # list of one or more .parquet (or .csv) paths to screen; each must contain the desired_columns + smiles_column (LABEL not required — screening produces predicted scores, not metrics)
smiles_column: "SMILES"
chemistry_filters: 'y' #  (N:for no, Y: for yes)
