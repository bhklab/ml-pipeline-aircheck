#==========================================================================
protein_name: "X" # Protein Name
Train: 'Y' # Running trian phase (N:for no, Y: for yes)
Test: 'Y' # Running test phase (N:for no, Y: for yes)
Screen: 'N'  # Running test phase (N:for no, Y: for yes)
#==========================================================================


# Data:
train_data: [D:\0000-UHN\PGK2\ProcessedData\DataToUse\Senarios\Senario3-Nabin\BalancedTrain\4columns_bitbirch-processing_cluster-info_ml-ready_PGK2_CDD_deduplicated_balanced_2x.parquet]
test_data: [ D:\0000-UHN\PGK2\ASMS\Data Shared by Mttheiu\TestFileWithAllAsmsPGK2_edited\4columns_ASMS_PGK2_allNegatives.parquet]


# desired_columns:  [ECFP4, ECFP6, FCFP4, FCFP6, TOPTOR, MACCS, RDK, AVALON, ATOMPAIR]           
desired_columns: [ECFP4 , FCFP4]

label_column_train: [LABEL]
label_column_test: [LABEL]

nrows_train: 'None' # integer or 'None' 
nrows_test: 'None'

# Note: selecting feature fusion makes the code so slow. Avoid it for big datasets!!
# Single mode: 'None' / 'All' / 'Pairwise'  -- e.g.  feature_fusion_method: 'Pairwise'
# Combine modes by passing a list, e.g.       feature_fusion_method: ['None', 'All', 'Pairwise']
feature_fusion_method: ['None'] # options: None, All, Pairwise (or a list of any combination) feature_fusion_method: ['None', 'All', 'Pairwise']


# create_balanced_datasets
balance_flag: False # Creating blanced train sets (True/False)
balance_ratios: [1, 2, 4, 8] # balance_ratios: [1, 2, 4, 8]
#==========================================================================


# Screening:
#==========================================================================
screen_data: [D:\0000-UHN\PGK2\ASMS\Data Shared by Mttheiu\TestFileWithAllAsmsPGK2_edited\4columns_ASMS_PGK2_allNegatives.parquet]
smiles_column: "SMILES"
chemistry_filters: 'y' #  (N:for no, Y: for yes)
#==========================================================================



# Model
#==========================================================================
# Supported models:
# rf: Random Forest
# lr: Logistic Regression
# svc: Support Vector Classifier
# nb: Gaussian Naive Bayes
# dt: Decision Tree
# knn: K-Nearest Neighbors
# gb: Gradient Boosting
# ada: AdaBoost
# bag: Bagging Classifier
# mlp: Multi-layer Perceptron
# lgbm:
# catboost:
# tf_ff: tensorflow simple feed forward neural network
# desired_models: [rf, lr, sgd, svc, nb, dt, knn, gb, ada, bag, mlp, lgbm, catboost, tf_ff, tf_cnn1D]

desired_models: [lgbm]
#desired_models: [lgbmregressor]

# Models' Hyperparameters tuning
# Options:
#   'none'     - use the values defined in `hyperparameters` below as-is (fastest).
#   'bayesian' - scikit-optimize BayesSearchCV on the train data (existing behaviour).
#   'optuna'   - Optuna TPE search using the saved CV folds (planned via hpo_utils.py).
hyperparameters_tuning: 'none'

# Optuna-specific knobs (used when hyperparameters_tuning == 'optuna').
# Each (model x column) gets its own SQLite study persisted under {RunFolderName}/HPO/.
optuna_n_trials: 30                  # Trials per model. 30-50 is a sane starting point; raise for harder spaces.
optuna_metric: 'area_hits_at_k'      # 'f1' | 'roc_auc' | 'average_precision' | 'precision' | 'precision_at_K' | 'hits_at_K' | 'area_hits_at_k' | 'area_hits_at_k_norm'
optuna_K: 100                        # K used by ranking metrics when the metric name doesn't carry an explicit K (area_hits_at_k, area_hits_at_k_norm). Inline forms like 'precision_at_50' override this.
optuna_n_jobs: 1                     # Parallel trials. Keep 1 for tensorflow models; >1 OK for sklearn/lgbm/catboost.

# Default hyperparameters used when hyperparameters_tuning == 'none'.
# Reasonable starting points for binary classification on imbalanced fingerprint data.
# Adjust per protein/dataset as needed; tuning modes ignore these.
hyperparameters:
  rf:           {n_estimators: 500, max_depth: 20, min_samples_split: 5, min_samples_leaf: 2, max_features: 'sqrt', class_weight: 'balanced', n_jobs: -1, random_state: 42}
  lr:           {C: 1.0, penalty: 'l2', solver: 'liblinear', class_weight: 'balanced', max_iter: 2000, random_state: 42}
  sgd:          {alpha: 0.0001, penalty: 'l2', class_weight: 'balanced', max_iter: 2000, random_state: 42}
  svc:          {C: 1.0, kernel: 'rbf', gamma: 'scale', class_weight: 'balanced', random_state: 42}
  nb:           {var_smoothing: 1.0e-9}
  dt:           {max_depth: 15, min_samples_split: 5, min_samples_leaf: 2, criterion: 'gini', class_weight: 'balanced', random_state: 42}
  knn:          {n_neighbors: 15, weights: 'distance', p: 2, n_jobs: -1}
  gb:           {n_estimators: 200, learning_rate: 0.05, max_depth: 5, min_samples_split: 5, min_samples_leaf: 2, subsample: 0.8, random_state: 42}
  ada:          {n_estimators: 200, learning_rate: 0.5, random_state: 42}
  bag:          {n_estimators: 100, max_samples: 0.8, max_features: 0.8, n_jobs: -1, random_state: 42}
  mlp:          {hidden_layer_sizes: [128, 64], alpha: 0.0001, learning_rate_init: 0.001, activation: 'relu', max_iter: 500, early_stopping: True, random_state: 42}
  lgbm:         {scale_pos_weight: 8, n_estimators: 3000, learning_rate: 0.02, num_leaves: 31, min_child_samples: 100, subsample: 0.7, subsample_freq: 1, colsample_bytree: 0.6, reg_alpha: 0.5, reg_lambda: 5.0, random_state: 42, verbosity: -1}
  lgbmregressor: {n_estimators: 3000, learning_rate: 0.02, num_leaves: 31, min_child_samples: 100, subsample: 0.7, subsample_freq: 1, colsample_bytree: 0.6, reg_alpha: 0.5, reg_lambda: 5.0, random_state: 42, verbosity: -1}
  catboost:     {iterations: 1000, learning_rate: 0.05, depth: 6, l2_leaf_reg: 5, auto_class_weights: 'Balanced', random_seed: 42}
  tf_ff:        {input_shape: 2048, hidden_units: [128, 64], learning_rate: 0.001}
  tf_cnn1D:     {input_shape: 2048, conv_layers: [[64, 3], [32, 3]], ff_layers: [64, 32], learning_rate: 0.001}

# Cross validation
# IMPORTANT — when cv_method: 'cluster', the following parameters are HARD-CODED
# inside model_utils._build_cluster_folds (intentionally kept out of config to avoid clutter; edit there if you need to change them):
#   n_clusters = 20                 # agglomerative clusters built from the positives
#   linkage = 'average'             # AgglomerativeClustering linkage (Tanimoto distance)
#   target_n_folds = 10             # max number of folds (fewer may be produced)
#   target_test_pos_per_fold = 100  # positives held out per fold's test set
#   test_neg_fraction = 0.25        # fraction of all negatives sampled per fold's test set
#   random_state = 42               # seed for reproducible fold construction
cv_method: 'cluster' # 'stratified' (StratifiedKFold) or 'cluster' (Tanimoto + Agglomerative cluster-held-out folds)
Nfold: 5 # Number of folds for the Crossfold validatrion method (used only when cv_method == 'stratified')
cluster_fold_train_neg_ratio: 'None' # Per-fold training-set negative downsampling (applies to each CV fold's train portion, not the full training file). Number => keep all positives and sample (number * #pos) negatives, e.g. 2 means 1:2 pos:neg. 'None' disables.
#==========================================================================


# Conformal Prediction
#==========================================================================
conformal_prediction: 'N' # Running conformal prediction (N:for no, Y: for yes)
confromal_test_size: 0.3
confromal_confidence_level: 0.95
#==========================================================================



# Model selection
#==========================================================================
trainfile_for_modelselection: [] # If empty, the top model by evaluation columns and result on the evaluation set is selected. Example: trainfile_for_modelselection: WDR91_SGC.parquet
evaluationfile_for_modelselection: [] # If empty, the top model by evaluation columns is selected. Exmple: evaluationfile_for_modelselection: evaluation.parquet
modelselection_basis: 'cv' # 'cv' to select models based on crossvalidation_column, 'test' to select based on evaluation_column
cv_radar_threshold: 0.2   # Probability cutoff used to recompute CV radar metrics from CVResults/*_mean_predictions_sorted.parquet.
test_radar_threshold: 0.2 # Probability cutoff used to recompute Test radar metrics from Predictions/*_predictions_sorted.parquet.
# K used by the area / weighted ranking metrics (AreaHitsAtK, AreaHitsAtK_norm,
# LogWeightedHitsAtK, NDCG_at_K, BEDROC_alpha20_atK). The column lists below use
# 'K' as a placeholder; config_utils.read_config substitutes this value into them
# at load time, so changing area_hits_K alone is enough.
area_hits_K: 500
# 'K' below is a placeholder auto-replaced with the value of area_hits_K (e.g. K=500 -> Test_AreaHitsAt500).
evaluation_column: [Test_AreaHitsAtK, Test_AreaHitsAtK_norm, Test_LogWeightedHitsAtK, Test_NDCG_at_K, Test_BEDROC_alpha20_atK, Test_HitsAt200, Test_HitsAt500, Test_HitsAt100, Test_HitsAt50, Test_PrecisionAt200, Test_PrecisionAt500, Test_TotalHits, Test_F1 Score, Test_Precision, Test_Recall, Test_Accuracy, Test_PlatePPV]
crossvalidation_column: [CV_AreaHitsAtK, CV_AreaHitsAtK_norm, CV_LogWeightedHitsAtK, CV_NDCG_at_K, CV_BEDROC_alpha20_atK, CV_HitsAt200, CV_HitsAt500, CV_HitsAt100, CV_HitsAt50, CV_PrecisionAt200, CV_PrecisionAt500, CV_TotalHits, CV_F1Score, CV_Precision, CV_Recall, CV_Accuracy, CV_PlatePPV]
#==========================================================================



# Model Fusion
#==========================================================================
Fusion: 'Y' # Running model fusion (N:for no, Y: for yes)
num_top_models: 2
# Methods to apply when Fusion is enabled. Any subset of [mean, max, weighted].
# 'weighted' trains a logistic-regression meta-learner on the best CV fold
# (chosen by mean Hit@200 across the top models) and saves its weights to
# BestModels/fusion_weights.{pkl,csv,_summary.csv}. fusion_weighted_C is the
# L2 regularization strength of that meta-learner (passed as 1/C to LR).
fusion_method: ['mean', 'max', 'weighted']
fusion_weighted_C: 1.0
#==========================================================================





